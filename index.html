<!-- Fullscreen control -->
<style>
.manuscript-fullscreen { cursor: pointer; flex-shrink: 0; }
.manuscript-fullscreen:hover { background: #cfbaa020; }
.manuscript-fullscreen:focus-visible { outline: 2px solid #e8c183; outline-offset: 3px; }
.fullscreen-start { position: fixed; top: 16px; right: 16px; z-index: 50; background: #17100ce6; }
.fullscreen-message { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 100; max-width: calc(100% - 32px); padding: 12px 18px; border: 1px solid #5c4434; border-radius: 8px; background: #17100c; color: #fff7ea; font: 14px/1.5 Arial,sans-serif; }
</style>
<script>
(() => {
  const active = () => !!(document.fullscreenElement || document.webkitFullscreenElement);
  function sync() {
    document.querySelectorAll('.manuscript-fullscreen').forEach(button => {
      const label = active() ? 'Exit fullscreen' : 'Enter fullscreen';
      button.setAttribute('aria-label', label);
      button.setAttribute('title', label);
      button.setAttribute('aria-pressed', String(active()));
    });
  }
  let pending = false;
  let messageTimer;
  window.toggleManuscriptFullscreen = async () => {
    if (pending) return;
    pending = true;
    try {
      if (active()) {
        const exit = document.exitFullscreen || document.webkitExitFullscreen;
        if (!exit) throw new Error('unavailable');
        await exit.call(document);
      } else {
        const root = document.documentElement;
        const enter = root.requestFullscreen || root.webkitRequestFullscreen;
        if (!enter) throw new Error('unavailable');
        await enter.call(root);
      }
    } catch (error) {
      let message = document.getElementById('fullscreen-message');
      if (!message) {
        message = document.createElement('div');
        message.id = 'fullscreen-message';
        message.className = 'fullscreen-message';
        message.setAttribute('role', 'status');
        document.body.appendChild(message);
      }
      message.textContent = 'Fullscreen is unavailable in this browser or window.';
      clearTimeout(messageTimer);
      messageTimer = setTimeout(() => message.remove(), 5000);
    } finally {
      pending = false;
      sync();
    }
  };
  document.addEventListener('fullscreenchange', sync);
  document.addEventListener('webkitfullscreenchange', sync);
})();
</script>
